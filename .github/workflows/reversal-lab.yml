name: Reversal labeling pipeline
on:
  push:
    paths: ['reversal_lab/**', 'tests/**', 'requirements*.txt', '.github/workflows/reversal-lab.yml']
  pull_request:
    paths: ['reversal_lab/**', 'tests/**', 'requirements*.txt', '.github/workflows/reversal-lab.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --check reversal_lab/web/app.js
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m tests.browser_e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: .test-artifacts/labeler-*.png
